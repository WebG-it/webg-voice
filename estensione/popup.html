<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>WebG Voice</title>
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="testa">
  <span class="marchio" aria-hidden="true"><span class="cornice"><svg viewBox="0 0 16 16"><circle cx="5" cy="9.5" r="2"/><path d="M8.6 6.2a4.6 4.6 0 0 1 0 6.6l-1-1a3.2 3.2 0 0 0 0-4.6zM10.9 3.9a7.9 7.9 0 0 1 0 11.2l-1-1a6.5 6.5 0 0 0 0-9.2z"/></svg></span></span>
  <h1 id="nome">WebG Voice</h1>
  <span class="versione" id="versione"></span>
  <button id="guida" class="leggero icona" title="Guida" aria-label="Guida">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 1.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zm-.1 8a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zM8 4c1.4 0 2.5.9 2.5 2.1 0 .9-.5 1.4-1.2 1.8-.5.3-.6.5-.6.9v.3H7.3v-.4c0-.9.4-1.4 1.1-1.8.5-.3.7-.5.7-.8 0-.4-.4-.7-1-.7s-1 .3-1.1.9L5.6 6C5.8 4.8 6.7 4 8 4z"/></svg>
  </button>
  <button id="impostazioni" class="leggero icona" title="Impostazioni" aria-label="Impostazioni">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.9 1h2.2l.4 1.9c.4.1.8.3 1.1.5l1.6-1.1 1.5 1.5-1.1 1.6c.2.4.4.7.5 1.1l1.9.4v2.2l-1.9.4c-.1.4-.3.8-.5 1.1l1.1 1.6-1.5 1.5-1.6-1.1c-.4.2-.7.4-1.1.5L9.1 15H6.9l-.4-1.9c-.4-.1-.8-.3-1.1-.5l-1.6 1.1-1.5-1.5 1.1-1.6c-.2-.4-.4-.7-.5-1.1L1 9.1V6.9l1.9-.4c.1-.4.3-.8.5-1.1L2.3 3.8l1.5-1.5 1.6 1.1c.4-.2.7-.4 1.1-.5zM8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"/></svg>
  </button>
</header>

<main class="funzioni">
  <!-- 1. leggere -->
  <section class="funzione leggi" aria-labelledby="play">
    <div class="coppia">
      <button id="play" class="voce-funzione" title="Legge la selezione, o l'articolo della pagina se non c'è selezione">
        <span class="cornice" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M5 3.2v9.6c0 .6.6.9 1.1.6l7.4-4.8c.5-.3.5-.9 0-1.2L6.1 2.6C5.6 2.3 5 2.6 5 3.2z"/></svg></span>
        <span class="parole"><span class="etichetta">Leggi</span><span class="sotto">selezione o articolo</span></span>
      </button>
      <button id="stop" class="ferma" title="Ferma la lettura" aria-label="Ferma la lettura" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>
      </button>
    </div>
    <p class="tasti"><span id="tastoLeggi"><kbd id="tasto">Alt+Q</kbd></span> <span class="sep" aria-hidden="true">·</span> <span id="tastoFerma"><kbd id="tastoStop">Alt+W</kbd> ferma</span></p>
  </section>

  <!-- 2. dettare -->
  <section class="funzione detta" aria-labelledby="detta">
    <button id="detta" class="voce-funzione" title="Detta nel campo dove hai il cursore">
      <span class="cornice verde" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5M5.5 14.5h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
      <span class="parole"><span class="etichetta">Detta</span><span id="dettaStato" class="sotto">nel campo dove scrivi</span></span>
    </button>
    <p class="tasti"><span id="tastoDettaBox"><kbd id="tastoDetta">Ctrl+Spazio</kbd> tieni premuto</span></p>
  </section>

  <!-- 3. trascrivere -->
  <section class="funzione trascrivi" aria-labelledby="chiamata">
    <button id="chiamata" class="voce-funzione" aria-expanded="false" aria-controls="chiamataBox" title="Trascrive la call della scheda e il tuo microfono, sul tuo computer">
      <span class="cornice rosso" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 2.5h10a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H8l-3 2.5V11H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1zm1.5 2.5v1.3h7V5zm0 2.6v1.3h4.5V7.6z"/></svg></span>
      <span class="parole"><span class="etichetta">Trascrivi la call</span><span id="chiamataSotto" class="sotto">Meet, Teams, Zoom nel browser</span></span>
      <svg class="freccia" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5 10 8l-4.5 4.5-1-1L8 8 4.5 4.5z"/></svg>
    </button>
    <section id="chiamataBox" class="riquadro" aria-live="polite" hidden></section>
    <section id="chiamataOpz" class="riquadro opzioni" hidden>
      <label class="campo">Dove salvare il file
        <input id="chiamataCartella" type="text" maxlength="120" spellcheck="false" placeholder="WebG Voice" aria-describedby="chiamataCartellaAiuto">
      </label>
      <p id="chiamataCartellaAiuto" class="mb">Una cartella dentro i Download (Chrome non permette altro). Vuota: WebG Voice.</p>
      <label class="consenso"><input id="chiamataChiediDove" type="checkbox"> Chiedi dove salvare ogni volta</label>
    </section>
  </section>
</main>

<section class="regola" aria-label="Voce e velocità">
  <div class="voci" role="radiogroup" aria-labelledby="etichettaVoce">
    <span class="solo-lettori" id="etichettaVoce">Voce</span>
    <button type="button" role="radio" data-voce="sara" aria-checked="true">Sara</button>
    <button type="button" role="radio" data-voce="nicola" aria-checked="false">Nicola</button>
  </div>
  <div class="velocita">
    <button type="button" id="velMeno" class="passo" aria-label="Più lenta" title="Più lenta">−</button>
    <input id="vel" type="range" min="0.7" max="1.5" step="0.05" value="1" aria-label="Velocità" aria-valuetext="1,00 per">
    <button type="button" id="velPiu" class="passo" aria-label="Più veloce" title="Più veloce">+</button>
    <output id="velVal" for="vel">1,00×</output>
  </div>
</section>

<section id="statoBox" class="stato" aria-live="polite">
  <span class="spia" aria-hidden="true"></span>
  <div class="statoCorpo">
    <p id="statoTesto">…</p>
    <progress id="barraDl" max="1" value="0" hidden></progress>
    <p id="mb" class="mb" hidden></p>
    <div class="azioniStato">
      <button id="scarica" class="primario" hidden>Scarica la voce</button>
      <button id="voceNaturale" hidden>Voce naturale</button>
      <button id="rifiuta" hidden>Non ora</button>
      <button id="riquadri" hidden>Consenti la lettura nei riquadri</button>
    </div>
  </div>
</section>

<p id="avvisoPagina" class="avviso" role="status" hidden></p>
<p id="avvisoTasto" class="avviso riga-avviso" hidden><span id="avvisoTastoTesto"></span> <a href="#" id="tastiAvviso">Sistema</a></p>

<section id="mp3Box" class="stato" aria-live="polite" hidden>
  <span class="spia" aria-hidden="true"></span>
  <div class="statoCorpo">
    <p id="mp3Testo"></p>
    <progress id="mp3Barra" max="1" value="0"></progress>
    <p id="mp3Dettaglio" class="mb"></p>
    <div class="azioniStato">
      <button id="mp3Annulla">Annulla</button>
      <a id="mp3Salva" class="bottone primario" href="#" download hidden>Salva di nuovo</a>
      <button id="mp3Chiudi" hidden>Chiudi</button>
    </div>
  </div>
</section>

<section id="bozzaBox" class="stato" aria-live="polite" hidden>
  <span class="spia" aria-hidden="true"></span>
  <div class="statoCorpo">
    <p id="bozzaTesto"></p>
    <ul id="bozzaLista" class="ripetizioni"></ul>
  </div>
</section>

<details id="incolla">
  <summary>Leggi un testo incollato</summary>
  <textarea id="testo" rows="4" placeholder="Incolla qui il testo da leggere…" spellcheck="false" aria-label="Testo da leggere"></textarea>
  <div class="azioniIncolla">
    <button id="leggiIncollato" class="primario">Leggi questo testo</button>
  </div>
</details>

<footer class="strumenti" aria-label="Altri strumenti">
  <button id="rileggiUltimo" class="leggero" title="Legge di nuovo l'ultimo testo, dall'inizio" disabled>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 7.3l1.4-.5A4 4 0 1 0 5 5.2L6.6 6.8H2.2V2.4l1.7 1.7A5.5 5.5 0 0 1 8 2.5z"/></svg>
    <span>Di nuovo</span>
  </button>
  <button id="rileggi" class="leggero" title="Per chi scrive: legge più lenta, con pause fra le frasi, e segnala le parole ripetute vicine">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.6 1.6a1.4 1.4 0 0 1 2 2L6.3 10.9l-2.8.8.8-2.8zM2 13.5h12V15H2z"/></svg>
    <span>Rileggi la bozza</span>
  </button>
  <button id="mp3" class="leggero" title="Crea un file MP3 del testo incollato, della selezione o dell'articolo">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.25 2h1.5v6.7l2.2-2.2 1.06 1.06L8 11.56 3.99 7.56 5.05 6.5l2.2 2.2zM3 12.5h10V14H3z"/></svg>
    <span>Crea MP3</span>
  </button>
</footer>

<script type="module" src="popup.js"></script>
<script type="module" src="popup-chiamata.js"></script>
</body>
</html>
